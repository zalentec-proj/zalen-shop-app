name: OWASP preview baseline

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: HTTPS URL do preview de homologação, sem dados de produção
        required: true
        type: string

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.preview_url }}
          cmd_options: '-a -m 3'
